# ==============================================================================
# Ejemplo de CI con GitHub Actions para la app Java/Maven (/authapp).
#
# Este proyecto usa Jenkins como pipeline principal (ver docs/decisions/
# 0002-jenkins-y-sonarqube-para-ci.md). Este workflow se incluye como
# ALTERNATIVA opcional basada en GitHub Actions.
#
# Mientras conserve la extensión `.example`, GitHub NO lo ejecuta.
# Para activarlo, renómbralo a `ci.yml`.
# ==============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Build y Test (Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: authapp
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build y Test
        run: mvn --batch-mode clean test

  # Opcional: análisis con SonarQube. Requiere definir los secrets
  # SONAR_TOKEN y SONAR_HOST_URL en Settings → Secrets and variables → Actions.
